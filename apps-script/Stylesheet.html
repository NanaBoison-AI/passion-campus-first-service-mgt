<style>
  :root {
    --blue: #1a73e8;
    --blue-d: #1557b0;
    --green: #1e8e3e;
    --red: #d93025;
    --bg: #f4f6fb;
    --panel: #ffffff;
    --line: #e3e7ee;
    --text: #202124;
    --muted: #5f6368;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Google Sans', Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  #app { display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar {
    width: 220px; background: #0f1b2d; color: #cfd8e6;
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .brand { padding: 22px 20px 12px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .brand-logo { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: 1px; }
  .brand-sub { font-size: 12px; color: #8aa0bd; margin-top: 2px; }
  nav { padding: 10px 8px; flex: 1; }
  .nav-item {
    display: block; padding: 11px 14px; margin: 3px 0; border-radius: 8px;
    color: #cfd8e6; cursor: pointer; font-size: 14px; user-select: none;
  }
  .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
  .nav-item.active { background: var(--blue); color: #fff; }
  .sidebar-foot { padding: 12px; border-top: 1px solid rgba(255,255,255,.08); }

  /* Content */
  .content { flex: 1; padding: 26px 30px; position: relative; overflow-y: auto; max-height: 100vh; }
  h1 { font-size: 24px; margin: 0 0 18px; }
  h2 { font-size: 16px; margin: 0; }
  .view-head { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .view-actions { display: flex; gap: 10px; align-items: center; }
  .hidden { display: none !important; }

  /* Cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap: 14px; margin-bottom: 20px; }
  .stat-card { background: var(--panel); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .stat-card .num { font-size: 30px; font-weight: 700; color: var(--blue); }
  .stat-card .lbl { color: var(--muted); font-size: 13px; margin-top: 4px; }

  /* Panels */
  .panel { background: var(--panel); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin-bottom: 18px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

  /* Inputs */
  .input {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
    font-size: 14px; background: #fff; font-family: inherit;
  }
  .input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,115,232,.15); }
  label { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
  label .input, label select.input, label textarea.input { margin-top: 4px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .req { color: var(--red); }
  .record-controls { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .record-controls label { min-width: 150px; }

  /* Buttons */
  .btn { border: none; border-radius: 8px; padding: 9px 16px; font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 500; }
  .btn-sm { padding: 6px 11px; font-size: 13px; }
  .btn-lg { padding: 12px 22px; font-size: 15px; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: var(--blue-d); }
  .btn-secondary { background: #e8f0fe; color: var(--blue-d); }
  .btn-secondary:hover { background: #d2e3fc; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn-ghost:hover { background: #f1f3f4; }
  .btn-danger-ghost { background: transparent; color: var(--red); border: 1px solid #f3c0bc; }
  .btn-danger-ghost:hover { background: #fce8e6; }
  .icon-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted); }
  .link-btn { background: none; border: none; color: var(--blue); cursor: pointer; padding: 0; font-size: 13px; }

  /* Tables */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { color: var(--muted); font-weight: 600; background: #f8f9fc; position: sticky; top: 0; }
  tbody tr:hover { background: #f8fbff; }

  /* Badges & chips */
  .badge { display: inline-block; min-width: 22px; text-align: center; padding: 2px 8px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .badge-green { background: #e6f4ea; color: var(--green); }
  .badge-red { background: #fce8e6; color: var(--red); }
  .badge-blue { background: #e8f0fe; color: var(--blue-d); }
  .chip { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; background: #eef1f6; color: var(--muted); }
  .chip.active { background: #e6f4ea; color: var(--green); }
  .chip.inactive { background: #fce8e6; color: var(--red); }
  .chip.visitor { background: #fff3e0; color: #e37400; }

  /* Roster (record attendance) */
  .roster-toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .roster-toolbar .input { max-width: 280px; }
  .roster-bulk { display: flex; gap: 8px; }
  .roster-count { margin-left: auto; font-weight: 600; color: var(--green); }
  .roster-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 8px; max-height: 50vh; overflow-y: auto; padding: 2px; }
  .roster-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: #fff;
  }
  .roster-item:hover { border-color: var(--blue); background: #f8fbff; }
  .roster-item.present { border-color: var(--green); background: #eef9f1; }
  .roster-item input { width: 18px; height: 18px; accent-color: var(--green); }
  .roster-item .ri-name { font-weight: 600; }
  .roster-item .ri-sub { font-size: 12px; color: var(--muted); }
  .roster-foot { display: flex; gap: 12px; margin-top: 16px; align-items: center; }

  /* People lists */
  .people-list { max-height: 55vh; overflow-y: auto; }
  .person {
    display: flex; align-items: center; gap: 10px; padding: 9px 6px; border-bottom: 1px solid var(--line);
  }
  .person .avatar {
    width: 34px; height: 34px; border-radius: 50%; background: var(--blue);
    color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px;
  }
  .person .p-name { font-weight: 600; }
  .person .p-sub { font-size: 12px; color: var(--muted); }

  /* Summary bar */
  .summary-bar { display: flex; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .summary-pill { background: var(--panel); border-radius: var(--radius); padding: 14px 20px; box-shadow: var(--shadow); flex: 1; min-width: 150px; }
  .summary-pill .sp-num { font-size: 26px; font-weight: 700; }
  .summary-pill .sp-lbl { color: var(--muted); font-size: 12px; }
  .progress { height: 10px; border-radius: 6px; background: #e8eaed; overflow: hidden; margin-top: 14px; display: flex; }
  .progress .seg-present { background: var(--green); }
  .progress .seg-absent { background: var(--red); }

  /* Chart */
  .chart { width: 100%; height: 420px; }
  .empty { text-align: center; color: var(--muted); padding: 40px; }

  /* Modal */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal-card { background: #fff; border-radius: 14px; width: 460px; max-width: 92vw; max-height: 92vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .modal-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
  .modal-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }

  /* Toast + loader */
  .toast {
    position: fixed; top: 18px; right: 18px; background: #323232; color: #fff;
    padding: 12px 18px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.3);
    z-index: 100; opacity: 0; transform: translateY(-10px); transition: .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.ok { background: var(--green); }
  .toast.err { background: var(--red); }
  .loader { position: absolute; inset: 0; background: rgba(244,246,251,.6); display: flex; align-items: center; justify-content: center; z-index: 40; }
  .spinner { width: 42px; height: 42px; border: 4px solid #d2e3fc; border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .muted { color: var(--muted); }
  .right { text-align: right; }
  .nowrap { white-space: nowrap; }
</style>
