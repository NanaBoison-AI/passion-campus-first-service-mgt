<style>
  /* =========================================================
     FLCPC Members CMS — mobile-first, modern UI
     Base styles target the phone; min-width queries scale up.
     ========================================================= */
  :root {
    --brand: #4f46e5;        /* indigo */
    --brand-d: #4338ca;
    --brand-soft: #eef0fe;
    --accent: #0ea5e9;
    --green: #16a34a; --green-soft: #e7f6ec;
    --red: #dc2626;   --red-soft: #fdeaea;
    --amber: #d97706; --amber-soft: #fdf1e3;
    --bg: #f4f5fb;
    --surface: #ffffff;
    --surface-2: #f8f9fe;
    --text: #0f172a;
    --muted: #64748b;
    --line: #e8eaf3;
    --r-sm: 10px; --r: 14px; --r-lg: 20px; --r-xl: 26px;
    --sh-sm: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.05);
    --sh: 0 4px 14px rgba(16,24,40,.07);
    --sh-lg: 0 12px 34px rgba(16,24,40,.16);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --tabbar-h: 64px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Inter', 'Google Sans', Roboto, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { margin: 0; }

  #app { min-height: 100vh; }
  .content { padding-bottom: calc(var(--tabbar-h) + 24px + var(--safe-b)); }
  .view { padding: 16px; }
  .view.hidden { display: none !important; }
  .hidden { display: none !important; }

  /* ---------- App bar ---------- */
  .appbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top, 0px));
    background: rgba(255,255,255,.82); backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .appbar-title { font-size: 20px; font-weight: 750; letter-spacing: -.01em; }
  .appbar-refresh {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--surface); color: var(--muted); font-size: 18px; cursor: pointer;
  }
  .appbar-refresh:active { background: var(--surface-2); }

  /* ---------- Bottom tab bar ---------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex; background: rgba(255,255,255,.94); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
    padding: 6px 2px calc(6px + var(--safe-b)); height: calc(var(--tabbar-h) + var(--safe-b));
  }
  .nav-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; color: var(--muted); font-size: 10.5px; font-weight: 600; cursor: pointer;
    border-radius: 12px; user-select: none; padding: 4px 2px; transition: color .15s;
  }
  .nav-item .ti { font-size: 21px; line-height: 1; transition: transform .15s; }
  .nav-item.active { color: var(--brand); }
  .nav-item.active .ti { transform: translateY(-2px) scale(1.06); }
  .nav-item:active { background: var(--surface-2); }

  /* ---------- FAB ---------- */
  .fab {
    position: fixed; right: 16px; z-index: 45;
    bottom: calc(var(--tabbar-h) + 16px + var(--safe-b));
    width: 56px; height: 56px; border-radius: 19px; border: none; cursor: pointer;
    background: var(--brand); color: #fff; font-size: 28px; line-height: 1;
    box-shadow: 0 8px 22px rgba(79,70,229,.42); transition: transform .12s, box-shadow .2s;
  }
  .fab:active { transform: scale(.94); }

  /* ---------- Cards / panels ---------- */
  .panel { background: var(--surface); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--sh-sm); margin-bottom: 14px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h2 { font-size: 16px; font-weight: 700; }
  .two-col { display: grid; grid-template-columns: 1fr; gap: 14px; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .stat-card { background: var(--surface); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--sh-sm); }
  .stat-card .num { font-size: 28px; font-weight: 800; color: var(--brand); letter-spacing: -.02em; }
  .stat-card .lbl { color: var(--muted); font-size: 12.5px; margin-top: 3px; }

  /* ---------- Inputs ---------- */
  .input, select.input, textarea.input {
    width: 100%; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: var(--r);
    font-size: 15px; background: var(--surface); font-family: inherit; color: var(--text);
    min-height: 50px; transition: border-color .15s, box-shadow .15s;
  }
  textarea.input { min-height: 70px; }
  .input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
  label { display: block; font-size: 12.5px; color: var(--muted); font-weight: 600; }
  label .input, label select.input, label textarea.input { margin-top: 5px; }
  .form-row { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .req { color: var(--red); }
  .search { margin-bottom: 14px; }

  .record-controls { display: flex; flex-direction: column; gap: 12px; }
  .record-controls label { width: 100%; }
  .record-controls .btn { width: 100%; }

  /* ---------- Buttons ---------- */
  .btn {
    border: none; border-radius: var(--r); padding: 13px 18px; font-size: 15px; cursor: pointer;
    font-family: inherit; font-weight: 650; min-height: 50px; transition: background .15s, transform .1s;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:active { transform: scale(.98); }
  .btn-sm { padding: 9px 13px; font-size: 13.5px; min-height: 40px; }
  .btn-lg { padding: 15px 22px; font-size: 16px; min-height: 54px; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-primary:active { background: var(--brand-d); }
  .btn-secondary { background: var(--brand-soft); color: var(--brand-d); }
  .btn-ghost { background: var(--surface); color: var(--muted); border: 1.5px solid var(--line); }
  .btn-danger-ghost { background: var(--surface); color: var(--red); border: 1.5px solid #f3c7c7; }
  .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--muted); width: 40px; height: 40px; border-radius: 10px; }
  .link-btn { background: none; border: none; color: var(--brand); cursor: pointer; padding: 0; font-size: 13.5px; font-weight: 600; }

  /* ---------- Tables (scroll on small) ---------- */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line); font-size: 13.5px; white-space: nowrap; }
  th { color: var(--muted); font-weight: 650; background: var(--surface-2); }
  tbody tr:active { background: var(--surface-2); }

  /* ---------- Member cards ---------- */
  .mcard {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 9px; cursor: pointer;
    box-shadow: var(--sh-sm); transition: transform .1s;
  }
  .mcard:active { transform: scale(.99); background: var(--surface-2); }
  .mc-main { flex: 1; min-width: 0; }
  .mc-name { font-weight: 700; }
  .mc-sub { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mc-edit { color: var(--brand); font-size: 16px; }

  /* ---------- Avatars / chips / badges ---------- */
  .avatar {
    width: 42px; height: 42px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px;
    color: #fff; background: linear-gradient(135deg, var(--brand), var(--accent));
  }
  .badge { display: inline-block; min-width: 22px; text-align: center; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 700; }
  .badge-green { background: var(--green-soft); color: var(--green); }
  .badge-red { background: var(--red-soft); color: var(--red); }
  .badge-blue { background: var(--brand-soft); color: var(--brand-d); }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
  .chip.active { background: var(--green-soft); color: var(--green); }
  .chip.inactive { background: var(--red-soft); color: var(--red); }
  .chip.visitor { background: var(--amber-soft); color: var(--amber); }

  /* ---------- Roster (record attendance) ---------- */
  .roster-toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .roster-bulk { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .roster-bulk .btn { width: 100%; }
  .roster-count { font-weight: 700; color: var(--green); text-align: center; padding: 4px; }
  .roster-list { display: grid; grid-template-columns: 1fr; gap: 9px; }
  .roster-item {
    display: flex; align-items: center; gap: 13px; padding: 14px; background: var(--surface);
    border: 1.5px solid var(--line); border-radius: var(--r); cursor: pointer; transition: .12s;
  }
  .roster-item:active { transform: scale(.99); }
  .roster-item.present { border-color: var(--green); background: var(--green-soft); }
  .roster-item input { width: 22px; height: 22px; accent-color: var(--green); flex-shrink: 0; }
  .roster-item .ri-name { font-weight: 700; }
  .roster-item .ri-sub { font-size: 12.5px; color: var(--muted); }
  .roster-foot {
    position: sticky; z-index: 20; bottom: calc(var(--tabbar-h) + 8px + var(--safe-b));
    display: flex; flex-direction: column; gap: 10px; margin-top: 14px; padding: 12px;
    background: rgba(255,255,255,.92); backdrop-filter: blur(8px); border: 1px solid var(--line);
    border-radius: var(--r-lg); box-shadow: var(--sh);
  }
  .roster-foot .btn { width: 100%; }

  /* ---------- People lists ---------- */
  .people-list { display: flex; flex-direction: column; }
  .person { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .person:last-child { border-bottom: none; }
  .person .p-name { font-weight: 650; }
  .person .p-sub { font-size: 12.5px; color: var(--muted); }

  /* ---------- Summary ---------- */
  .summary-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .summary-pill { background: var(--surface); border-radius: var(--r-lg); padding: 14px; box-shadow: var(--sh-sm); }
  .summary-pill .sp-num { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .summary-pill .sp-lbl { color: var(--muted); font-size: 12px; }
  .progress { height: 12px; border-radius: 8px; background: #eceef6; overflow: hidden; margin-top: 12px; display: flex; }
  .progress .seg-present { background: var(--green); }
  .progress .seg-absent { background: var(--red); }

  /* ---------- Chart ---------- */
  .chart { width: 100%; height: 340px; }
  .empty { text-align: center; color: var(--muted); padding: 36px 16px; }

  /* ---------- Bottom-sheet modal ---------- */
  .sheet { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; background: rgba(15,23,42,.5); }
  .sheet.hidden { display: none !important; }
  .sheet-card {
    width: 100%; max-width: 560px; background: var(--surface);
    border-radius: var(--r-xl) var(--r-xl) 0 0; max-height: 92vh; overflow-y: auto;
    box-shadow: var(--sh-lg); animation: sheetUp .26s cubic-bezier(.2,.8,.2,1);
    padding-bottom: var(--safe-b);
  }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
  .sheet-handle { width: 42px; height: 5px; border-radius: 5px; background: #d2d6e4; margin: 10px auto 2px; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 18px 12px; }
  .sheet-head h2 { font-size: 18px; }
  .sheet-body { padding: 4px 18px 16px; display: flex; flex-direction: column; gap: 13px; }
  .sheet-foot {
    position: sticky; bottom: 0; background: var(--surface); padding: 14px 18px;
    padding-bottom: calc(14px + var(--safe-b)); border-top: 1px solid var(--line);
    display: flex; gap: 10px;
  }
  .sheet-foot .btn { flex: 1; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%) translateY(-16px);
    top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 100; max-width: 90vw;
    background: #0f172a; color: #fff; padding: 12px 18px; border-radius: 14px;
    box-shadow: var(--sh-lg); opacity: 0; transition: .25s; pointer-events: none; font-size: 14px; font-weight: 600;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok { background: var(--green); }
  .toast.err { background: var(--red); }

  /* ---------- Top progress loader ---------- */
  #loader.bar-loader { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 90; overflow: hidden; background: transparent; }
  #loader.bar-loader::after {
    content: ''; position: absolute; height: 100%; width: 38%;
    background: linear-gradient(90deg, transparent, var(--brand), transparent);
    animation: slide 1s linear infinite;
  }
  @keyframes slide { from { left: -40%; } to { left: 100%; } }

  /* ---------- Skeletons ---------- */
  .skel { background: linear-gradient(90deg, #eef0f7 25%, #e3e7f2 37%, #eef0f7 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: var(--r); }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .skel-card { height: 92px; }

  .muted { color: var(--muted); }
  .nowrap { white-space: nowrap; }

  /* =========================================================
     DESKTOP / TABLET — promote the tab bar to a side rail
     ========================================================= */
  @media (min-width: 900px) {
    :root { --rail: 248px; }
    .content { margin-left: var(--rail); padding-bottom: 24px; }
    .view { padding: 24px 30px; max-width: 1180px; }

    .tabbar {
      flex-direction: column; top: 0; right: auto; width: var(--rail); height: 100vh;
      border-top: none; border-right: 1px solid var(--line); padding: 18px 12px; gap: 4px;
      background: var(--surface);
    }
    .tabbar::before {
      content: 'FLCPC · Members'; display: block; padding: 6px 14px 16px;
      font-weight: 800; font-size: 18px; color: var(--brand); letter-spacing: -.01em;
    }
    .nav-item { flex: none; flex-direction: row; justify-content: flex-start; gap: 12px; font-size: 14.5px; padding: 12px 14px; }
    .nav-item .ti { font-size: 19px; }
    .nav-item.active { background: var(--brand-soft); }
    .nav-item.active .ti { transform: none; }

    .appbar { background: var(--bg); backdrop-filter: none; border-bottom: 1px solid var(--line); }
    .fab { right: 30px; bottom: 28px; width: 60px; height: 60px; font-size: 30px; }

    .cards { grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); }
    .two-col { grid-template-columns: 1fr 1fr; }
    .form-row { grid-template-columns: 1fr 1fr; }
    .summary-bar { grid-template-columns: repeat(4,1fr); }
    .record-controls { flex-direction: row; align-items: flex-end; flex-wrap: wrap; }
    .record-controls label { width: auto; min-width: 180px; }
    .record-controls .btn { width: auto; }
    .roster-toolbar { flex-direction: row; align-items: center; }
    .roster-toolbar .input { max-width: 320px; }
    .roster-bulk { display: flex; }
    .roster-bulk .btn { width: auto; }
    .roster-count { margin-left: auto; }
    .roster-list { grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); }
    .roster-foot { position: sticky; bottom: 0; flex-direction: row; align-items: center; }
    .roster-foot .btn { width: auto; }
    .chart { height: 440px; }

    /* Centered dialog instead of bottom sheet on large screens */
    .sheet { align-items: center; }
    .sheet-card { border-radius: var(--r-xl); max-width: 480px; max-height: 90vh; animation: pop .2s ease; }
    @keyframes pop { from { transform: scale(.96); opacity: .6; } to { transform: none; opacity: 1; } }
    .sheet-handle { display: none; }
  }
</style>
